name: Publish memories-mcp to npm
on:
  release:
    types: [published]
  workflow_dispatch:   # manual re-publish (e.g. bootstrap first publish)
permissions:
  contents: read
  id-token: write   # OIDC provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mcp-server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm test
      - run: npm install -g npm@latest
      # TEMPORARY: token auth for the bootstrap publish (package must exist
      # before a trusted publisher can be configured). Remove the env line
      # and the NODE_AUTH_TOKEN secret once trusted publishing is set up.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
