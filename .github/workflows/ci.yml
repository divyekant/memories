name: CI

on:
  push:
    branches: [main, develop, rust-rewrite]
  pull_request:
    branches: [main, develop, rust-rewrite]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }

      - name: MCP server install (pytest's stdio smoke needs node_modules)
        run: |
          cd mcp-server
          npm ci --ignore-scripts
          node --check index.js

      - name: MCP server tests
        run: cd mcp-server && npm test

      - name: Run pytest
        run: uv run pytest -q

      - name: Hook script syntax
        run: |
          for f in plugin/hooks/*.sh integrations/codex/hooks/*.sh; do
            bash -n "$f"
          done

  docker-image:
    # The 5.5.0 release crash-looped because new modules were missing from the
    # Dockerfile COPY list — host pytest can never catch that. Build the image
    # and import the app module inside it.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t memories-ci --target core .

      - name: Import app inside image
        run: docker run --rm --entrypoint python memories-ci -c "import app; print('app imports OK')"

  rust:
    # Rust server (server/): format, lint, tests, supply-chain checks.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server

      - name: Format check
        run: cargo fmt --all --check

      - name: Lint check
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Cache the embedding model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-all-MiniLM-L6-v2-1110a243fdf4706b3f48f1d95db1a4f5529b4d41

      - name: Embedding parity with Python (gate G2)
        # Same ONNX Runtime release and hash as server/Dockerfile (stage ort-amd64).
        # With no cache, the test downloads the model from the Hub.
        run: |
          curl -sSfLo "$RUNNER_TEMP/ort.tgz" https://github.com/microsoft/onnxruntime/releases/download/v1.31.0/onnxruntime-linux-x64-1.31.0.tgz
          echo "cc5c72baf5ae5c8238a6841f0897227be2d02826b9cf98eaf02fdefaeeb03a57  $RUNNER_TEMP/ort.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP"
          ORT_DYLIB_PATH="$RUNNER_TEMP/onnxruntime-linux-x64-1.31.0/lib/libonnxruntime.so" \
            cargo test --locked -p memories-embed --test parity -- --ignored --nocapture

      - name: Script tests
        run: python3 -m unittest discover -s scripts -v

      - name: No crate release less than 2 days old
        run: python3 scripts/check_crate_age.py Cargo.lock --days 2

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: server/Cargo.toml
          arguments: --locked
          command: check

  rust-image:
    # Build the Rust image on each architecture. Then start the bundled compose
    # file with that image, with no change to the file, and wait for healthy.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t ghcr.io/divyekant/memories:rust-ci server

      - name: Bundled compose file reports healthy
        run: server/scripts/compose_health_check.sh rust-ci
