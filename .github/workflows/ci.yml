name: CI

on:
  push:
    branches: [main, develop, rust-rewrite]
  pull_request:
    branches: [main, develop, rust-rewrite]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }

      - name: MCP server install (pytest's stdio smoke needs node_modules)
        run: |
          cd mcp-server
          npm ci --ignore-scripts
          node --check index.js

      - name: MCP server tests
        run: cd mcp-server && npm test

      - name: Run pytest
        run: uv run pytest -q

      - name: Hook script syntax
        run: |
          for f in plugin/hooks/*.sh integrations/codex/hooks/*.sh; do
            bash -n "$f"
          done

  parity:
    # Parity kit (Rust rewrite, task P0-1): replay the golden captures against a
    # new Python server. Zero differences is the pass condition.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Self-test of the kit
        run: uv run pytest -q tests/test_parity_kit.py

      - name: Rank golden cases match the Python functions
        run: .venv/bin/python -m parity.rank_golden --check

      - name: Start the Python reference server
        run: |
          PYTHON=.venv/bin/python parity/run_python_server.sh "$RUNNER_TEMP/parity-data" 18000 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 180); do
            curl -sf http://127.0.0.1:18000/health > /dev/null && exit 0
            sleep 1
          done
          echo "The server did not start" >&2
          exit 1

      - name: Replay the golden captures
        run: .venv/bin/python -m parity replay --base-url http://127.0.0.1:18000 --out "$RUNNER_TEMP/replay.ndjson"

      - name: Diff against the golden captures
        run: .venv/bin/python -m parity diff parity/golden/golden.ndjson "$RUNNER_TEMP/replay.ndjson"

      - name: Server log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log"

  docker-image:
    # The 5.5.0 release crash-looped because new modules were missing from the
    # Dockerfile COPY list — host pytest can never catch that. Build the image
    # and import the app module inside it.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t memories-ci --target core .

      - name: Import app inside image
        run: docker run --rm --entrypoint python memories-ci -c "import app; print('app imports OK')"

  rust:
    # Rust server (server/): format, lint, tests, supply-chain checks.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server

      - name: Format check
        run: cargo fmt --all --check

      - name: Lint check
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Script tests
        run: python3 -m unittest discover -s scripts -v

      - name: No crate release less than 2 days old
        run: python3 scripts/check_crate_age.py Cargo.lock --days 2

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: server/Cargo.toml
          arguments: --locked
          command: check

  rust-image:
    # Build the Rust image on each architecture. Then start the bundled compose
    # file with that image, with no change to the file, and wait for healthy.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t ghcr.io/divyekant/memories:rust-ci server

      - name: Bundled compose file reports healthy
        run: server/scripts/compose_health_check.sh rust-ci
