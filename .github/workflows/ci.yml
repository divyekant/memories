name: CI

on:
  push:
    branches: [main, develop, rust-rewrite]
  pull_request:
    branches: [main, develop, rust-rewrite]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }

      - name: MCP server install (pytest's stdio smoke needs node_modules)
        run: |
          cd mcp-server
          npm ci --ignore-scripts
          node --check index.js

      - name: MCP server tests
        run: cd mcp-server && npm test

      - name: Run pytest
        run: uv run pytest -q

      - name: Hook script syntax
        run: |
          for f in plugin/hooks/*.sh integrations/codex/hooks/*.sh; do
            bash -n "$f"
          done

  docker-image:
    # The 5.5.0 release crash-looped because new modules were missing from the
    # Dockerfile COPY list — host pytest can never catch that. Build the image
    # and import the app module inside it.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t memories-ci --target core .

      - name: Import app inside image
        run: docker run --rm --entrypoint python memories-ci -c "import app; print('app imports OK')"
