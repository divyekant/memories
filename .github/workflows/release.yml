name: Release
# Tags a commit on main, creates the GitHub release from its CHANGELOG section,
# and starts the npm publish. Use it where a tag cannot be pushed, for example
# from a cloud session: Actions > Release > Run workflow, or the API.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, for example 5.18.0"
        required: true
      sha:
        description: "Commit on main to tag. Empty: the head of main"
        required: false
      publish:
        description: "Start the npm publish. Turn off if this version is on npm"
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
concurrency: { group: release, cancel-in-progress: false }
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      V: ${{ inputs.version }}
      SHA_IN: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check the inputs
        run: |
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          SHA="${SHA_IN:-$(git rev-parse origin/main)}"
          [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::sha must be a commit hash"; exit 1; }
          SHA=$(git rev-parse --verify "$SHA^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then echo "::error::tag v$V exists"; exit 1; fi
          PKG=$(git show "$SHA:mcp-server/package.json" | jq -r .version)
          [ "$PKG" = "$V" ] || { echo "::error::mcp-server/package.json at $SHA is $PKG, not $V"; exit 1; }
          git show "$SHA:CHANGELOG.md" | awk -v h="## [$V]" 'index($0, h) == 1 { f = 1; next } /^## \[/ { f = 0 } f' > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no [$V] section"; exit 1; }
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Tag and release
        run: |
          git tag "v$V" "$SHA"
          git push origin "refs/tags/v$V"
          gh release create "v$V" --verify-tag --title "v$V" --notes-file "$RUNNER_TEMP/notes.md"
      # A release made with GITHUB_TOKEN does not start other workflows, so
      # start the npm publish here. workflow_dispatch is the allowed exception.
      - name: Start the npm publish
        if: ${{ inputs.publish }}
        run: gh workflow run publish-npm.yml --ref "v$V"
