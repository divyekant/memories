services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage

  memories:
    # The Rust server (v6). To build the Python server (v5, the rollback
    # reference) use the root Dockerfile: docker build --target core .
    build:
      context: ./server
      additional_contexts:
        webui: ./webui
    image: memories:rust
    container_name: memories
    restart: unless-stopped
    depends_on:
      - qdrant
    mem_limit: ${MEMORIES_MEM_LIMIT:-3g}
    ports:
      - "8900:8000"
    volumes:
      - ./data:/data
    # The server logs one line at start for each variable that it does not use.
    # The full list is in docs/rust-rewrite/configuration.md.
    environment:
      - DATA_DIR=/data
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=all-MiniLM-L6-v2
      # Embedding provider: onnx only on the Rust server.
      - EMBED_PROVIDER=${EMBED_PROVIDER:-onnx}
      - EMBED_MODEL=${EMBED_MODEL:-}
      - EMBED_DIMENSION=${EMBED_DIMENSION:-}
      - EMBED_QUERY_PREFIX=${EMBED_QUERY_PREFIX:-}
      - EMBED_DOC_PREFIX=${EMBED_DOC_PREFIX:-}
      - MAX_BACKUPS=10
      # Qdrant backend
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-memories}
      - QDRANT_WAIT=${QDRANT_WAIT:-true}
      - QDRANT_WRITE_ORDERING=${QDRANT_WRITE_ORDERING:-strong}
      - QDRANT_READ_CONSISTENCY=${QDRANT_READ_CONSISTENCY:-majority}
      - QDRANT_REPLICATION_FACTOR=${QDRANT_REPLICATION_FACTOR:-1}
      - QDRANT_WRITE_CONSISTENCY_FACTOR=${QDRANT_WRITE_CONSISTENCY_FACTOR:-1}
      # Extraction provider: anthropic, openai, ollama or omlx
      - EXTRACT_PROVIDER=${EXTRACT_PROVIDER:-}
      - EXTRACT_MODEL=${EXTRACT_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_OAUTH_TOKEN=${ANTHROPIC_OAUTH_TOKEN:-}
      - ANTHROPIC_AUTH=${ANTHROPIC_AUTH:-}
      - ANTHROPIC_WORKSPACE_ID=${ANTHROPIC_WORKSPACE_ID:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OMLX_URL=${OMLX_URL:-}
      - OMLX_API_KEY=${OMLX_API_KEY:-}
      - EXTRACT_FALLBACK_ADD=${EXTRACT_FALLBACK_ADD:-false}
      - EXTRACT_FALLBACK_MAX_FACTS=${EXTRACT_FALLBACK_MAX_FACTS:-1}
      - EXTRACT_FALLBACK_MIN_FACT_CHARS=${EXTRACT_FALLBACK_MIN_FACT_CHARS:-24}
      - EXTRACT_FALLBACK_MAX_FACT_CHARS=${EXTRACT_FALLBACK_MAX_FACT_CHARS:-280}
      - EXTRACT_FALLBACK_NOVELTY_THRESHOLD=${EXTRACT_FALLBACK_NOVELTY_THRESHOLD:-0.88}
      # - MAX_EXTRACT_MESSAGE_CHARS=120000
      # - EXTRACT_MAX_INFLIGHT=2
      # Usage analytics (opt-in)
      - USAGE_TRACKING=${USAGE_TRACKING:-}
      # Audit log (opt-in)
      - AUDIT_LOG=${AUDIT_LOG:-false}
      # Scheduled maintenance (consolidation and pruning, needs EXTRACT_PROVIDER)
      - MAINTENANCE_ENABLED=${MAINTENANCE_ENABLED:-false}
      # Allocator setting of the production install. The Rust server does not
      # need MALLOC_TRIM_THRESHOLD_ or MALLOC_MMAP_THRESHOLD_.
      - MALLOC_ARENA_MAX=${MALLOC_ARENA_MAX:-2}
    healthcheck:
      test: ["CMD", "memories-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start on Python data runs a migration (about 1 minute for
      # 93,000 records). Only /health answers during the migration.
      start_period: 120s

  # Remote MCP server for the claude.ai (Claude web) connector — OAuth 2.1 +
  # Streamable HTTP front door in front of the `memories` service above.
  # Profile-gated: `docker compose up` alone does NOT start this; opt in with
  # `docker compose --profile remote-mcp up -d`. See README's "Claude web
  # (claude.ai) connector" section for setup.
  remote-mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile.remote
    image: memories-remote-mcp
    container_name: remote-mcp
    profiles: ["remote-mcp"]
    restart: unless-stopped
    depends_on:
      - memories
    ports:
      - "127.0.0.1:8910:8910"
    volumes:
      - remote_mcp_data:/data/remote-mcp
    environment:
      - REMOTE_MCP_ISSUER=${REMOTE_MCP_ISSUER:-http://localhost:8910}
      - REMOTE_MCP_PORT=8910
      - REMOTE_MCP_AUTH=${REMOTE_MCP_AUTH:-oauth}
      - REMOTE_MCP_PASSWORD_HASH=${REMOTE_MCP_PASSWORD_HASH:-}
      - REMOTE_MCP_TOKEN_SECRET=${REMOTE_MCP_TOKEN_SECRET:-}
      - REMOTE_MCP_STORE_DIR=/data/remote-mcp
      - REMOTE_MCP_TRUST_PROXY=${REMOTE_MCP_TRUST_PROXY-uniquelocal}
      - MEMORIES_URL=http://memories:8000
      - MEMORIES_API_KEY=${API_KEY:-}

volumes:
  qdrant-storage:
  remote_mcp_data:
